[project]
name = "ghostroot"
version = "0.2.0"
description = "Reconstructing a lost extinct language from a growing archaeological corpus."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
